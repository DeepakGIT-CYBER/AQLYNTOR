version: '3.8'

services:
  aqlyntor-gateway:
    build: .
    container_name: aqlyntor_v11_core
    ports:
      - "8000:8000"
    restart: always
    environment:
      - ENVIRONMENT=production
      - AQLYNTOR_VERSION=v11.0

  prometheus:
    image: prom/prometheus:latest
    container_name: aqlyntor_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - aqlyntor-gateway
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: aqlyntor_grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: always